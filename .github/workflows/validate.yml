name: Validate app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check app JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: Syntax-check Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find worker/src -type f -name '*.js' -print0 | sort -z)

      - name: Validate Worker package JSON
        run: node -e "JSON.parse(require('fs').readFileSync('worker/package.json', 'utf8')); console.log('worker/package.json is valid JSON')"

      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('manifest.webmanifest is valid JSON')"

      - name: Verify local app-shell files exist
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          const refs = [...sw.matchAll(/\"(\.\/[^"]+)\"/g)].map((match) => match[1]);
          const missing = refs
            .filter((ref) => ref !== './')
            .map((ref) => ref.replace(/^\.\//, ''))
            .filter((file) => !fs.existsSync(file));
          if (missing.length) {
            console.error('Missing app-shell files:', missing.join(', '));
            process.exit(1);
          }
          console.log(`Verified ${refs.length} app-shell entries.`);
          NODE

      - name: Run meetup intelligence tests
        run: |
          node tests/intelligence-core.test.cjs
          node tests/release-smoke.test.cjs
          node tests/recovery-ownership.test.cjs
          node tests/accessibility-smoke.test.cjs
          node tests/dialog-accessibility-behavior.test.cjs
          node tests/shared-live-scheduler.test.cjs
          node tests/shared-live-freshness.test.cjs
          node tests/shared-plan-update.test.cjs
          node tests/shared-reload-safari.test.cjs
          node tests/routing-coalescer.test.cjs
          node tests/provider-health.test.cjs
          node tests/service-worker-behavior.test.cjs
          node tests/share-expiry-cache.test.cjs
          node tests/trip-guidance.test.cjs
          node tests/trip-guidance-transfer-window.test.cjs
          node tests/trip-guidance-observer.test.cjs
          node tests/transfer-watch.test.cjs
          node tests/stop-awareness.test.cjs
          node tests/journey-contradictions.test.cjs
          node tests/journey-chaos-replay.test.cjs
          node tests/diagnostics-privacy.test.cjs
          node tests/meetup-radar.test.cjs
          node tests/what-if.test.cjs
          node tests/intelligence-voluntary-sync.test.cjs
          node tests/worker-plan-equivalence.test.cjs
          node tests/worker-config.test.cjs
          node tests/worker-live.test.cjs
          node tests/worker-expiry.test.cjs
